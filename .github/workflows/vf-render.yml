# ENGINE 1 in der Cloud: episodes/queue/*.json -> Block-Studio rendert -> MP4 nach R2 -> VIDEO_READY an den Orchestrator
name: "VIRALFLOW · Engine 1 · Render"

on:
  push:
    branches: [main]
    paths: ["episodes/queue/**.json"]
  repository_dispatch:
    types: [vf-render]
  workflow_dispatch:
    inputs:
      file:
        description: "Pfad einer Episode (leer = ganze Warteschlange)"
        required: false
      test:
        description: "ja = privates Testvideo (rendern + prüfen, Link im Log, NICHT veröffentlichen)"
        required: false
        default: "nein"

permissions:
  contents: write

env:
  VF_QUALITY: hq   # 4K-Look (freigegeben 20.11.2026); "classic" = alter Look
  VF_RS: '2.0'     # echtes 4K (21.11.2026): GL-Auflösung 2160x3840 …
  VF_OUT: '2'      # … Ausgabe 2160x3840 (YouTube); Instagram/TikTok bekommen 1080p aus dem 4K-Master

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          EP_ID: ${{ github.event.client_payload.episode_id }}
          FILE: ${{ inputs.file }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            python3 -c 'import json,os;print("matrix="+json.dumps({"include":[{"episode_id":os.environ["EP_ID"],"file":""}]}))' >> "$GITHUB_OUTPUT"
          elif [ -n "$FILE" ]; then
            python3 -c 'import json,os;print("matrix="+json.dumps({"include":[{"episode_id":"","file":os.environ["FILE"]}]}))' >> "$GITHUB_OUTPUT"
          else
            python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json
          files = sorted(glob.glob("episodes/queue/*.json"))
          print("matrix=" + json.dumps({"include": [{"episode_id": "", "file": f} for f in files] or [{"episode_id": "", "file": ""}]}))
          EOF
          fi
      - id: p
        env:
          MATRIX: ${{ steps.m.outputs.matrix }}
          VF_PARTS: ${{ vars.VF_RENDER_PARTS || '16' }}  # 16 Teile: Luft für andere Workflows (Publish/Statistik) im Limit von 20 gleichzeitigen Jobs -> kein Warten
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          m = json.loads(os.environ["MATRIX"]); n = int(os.environ.get("VF_PARTS") or 4)
          inc = [{"file": e["file"], "stem": os.path.basename(e["file"])[:-5], "part": f"{k}/{n}"} for e in m["include"] if e.get("file") and n > 1 for k in range(n)]
          print("parts=" + json.dumps({"include": inc or [{"file": "", "stem": "", "part": ""}]}))
          EOF

  # Stimme EINMAL erzeugen und an alle Render-Teile verteilen -> identische Sprachspur/Wortzeiten auf jedem Server (Cache-Treffer beim Zusammenbau)
  voice:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Nichts zu tun?
        if: matrix.file == ''
        run: echo "keine Datei"
      - uses: actions/checkout@v4
        if: matrix.file != ''
      - uses: actions/setup-python@v5
        if: matrix.file != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viralflow/requirements-render.txt
      - uses: actions/cache@v4
        if: matrix.file != ''
        with:
          path: ~/.cache/block_studio
          key: voices-v1
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: matrix.file != ''
        continue-on-error: true
      - name: Stimme erzeugen
        if: matrix.file != ''
        run: |
          pip install -q -r viralflow/requirements-render.txt
          pip install -q --no-deps tinysoundfont
          python engine/roblox/studio.py "${{ matrix.file }}" -o /tmp/v.mp4 --stimme --force
          echo "STEM=$(basename "${{ matrix.file }}" .json)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: matrix.file != ''
        with:
          name: tts-${{ env.STEM }}
          path: /home/runner/.cache/block_studio/tts
          retention-days: 2

  # Verteiltes Rendern: jede Episode wird auf N Runner aufgeteilt (Shots nach Bildanzahl verteilt); der Haupt-Job setzt zusammen
  parts:
    needs: [plan, voice]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.parts) }}
    env:
      PYTHONPATH: ${{ github.workspace }}/viralflow
    steps:
      - name: Nichts zu tun?
        if: matrix.file == ''
        run: echo "kein Teil"
      - uses: actions/checkout@v4
        if: matrix.file != ''
      - uses: actions/setup-python@v5
        if: matrix.file != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viralflow/requirements-render.txt
      - name: Cache Stimmen-Modelle (Piper/Kokoro)
        if: matrix.file != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/block_studio
          key: voices-v1
      - name: ffmpeg installieren (ausfallsicher)
        if: matrix.file != ''
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
      - name: Abhängigkeiten
        if: matrix.file != ''
        run: |
          pip install -q -r viralflow/requirements-render.txt
          pip install -q --no-deps tinysoundfont  # echte Instrumente (SoundFont), ohne pyaudio
          for i in 1 2 3 4; do
            ok=1
            command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } || ok=0
            [ $ok = 1 ] && python -m playwright install --with-deps chromium && exit 0
            echo "Paketserver-Problem – neuer Versuch in $((i * 30)) s"; sleep $((i * 30))
          done
          exit 1
      - name: Gemeinsame Stimme holen
        if: matrix.file != '' && matrix.stem != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tts-${{ matrix.stem }}
          path: /home/runner/.cache/block_studio/tts
      - name: Teil rendern
        if: matrix.file != ''
        run: python -m vf.render_job --file "${{ matrix.file }}" --part "${{ matrix.part }}" --parts-out parts_out
      - name: Teil ablegen
        if: matrix.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.stem }}-${{ strategy.job-index }}
          path: parts_out
          retention-days: 2
          if-no-files-found: ignore

  render:
    needs: [plan, voice, parts]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      VF_API_URL: ${{ secrets.VF_API_URL }}
      VF_WEBHOOK_SECRET: ${{ secrets.VF_WEBHOOK_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: viralflow-videos
      PYTHONPATH: ${{ github.workspace }}/viralflow
      EP_FILE: ${{ matrix.file }}
      EP_ID: ${{ matrix.episode_id }}
      VF_PARTS_IN: ${{ github.workspace }}/parts_in
      VF_TEST: ${{ inputs.test }}
    steps:
      - name: Nichts zu tun?
        if: matrix.file == '' && matrix.episode_id == ''
        run: echo "Warteschlange leer"
      - uses: actions/checkout@v4
        if: matrix.file != '' || matrix.episode_id != ''
      - uses: actions/setup-python@v5
        if: matrix.file != '' || matrix.episode_id != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viralflow/requirements-render.txt
      - name: Cache Stimmen-Modelle (Piper/Kokoro)
        if: matrix.file != '' || matrix.episode_id != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/block_studio
          key: voices-v1
      - name: ffmpeg installieren (ausfallsicher)
        if: matrix.file != '' || matrix.episode_id != ''
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
      - name: Abhängigkeiten
        if: matrix.file != '' || matrix.episode_id != ''
        run: |
          pip install -q -r viralflow/requirements-render.txt
          pip install -q --no-deps tinysoundfont  # echte Instrumente (SoundFont), ohne pyaudio
          pip install -q sherpa-onnx  # Aussprache-Prüfung (Spracherkennung, offline)
          for i in 1 2 3 4; do
            ok=1
            command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } || ok=0
            [ $ok = 1 ] && python -m playwright install --with-deps chromium && exit 0
            echo "Paketserver-Problem – neuer Versuch in $((i * 30)) s"; sleep $((i * 30))
          done
          exit 1
      - name: Name für Teile
        id: stem
        if: matrix.file != ''
        run: echo "s=$(basename "$EP_FILE" .json)" >> "$GITHUB_OUTPUT"
      - name: Gemeinsame Stimme holen
        if: matrix.file != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tts-${{ steps.stem.outputs.s }}
          path: /home/runner/.cache/block_studio/tts
      - name: Verteilte Teile holen
        if: matrix.file != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shots-${{ steps.stem.outputs.s }}-*
          path: parts_in
          merge-multiple: true
      - name: Rendern + hochladen + VIDEO_READY
        id: render
        if: matrix.file != '' || matrix.episode_id != ''
        run: |
          if [ -n "$EP_FILE" ]; then python -m vf.render_job --file "$EP_FILE"; else python -m vf.render_job --episode-id "$EP_ID"; fi
      - name: Auftrag nach episodes/done verschieben
        if: steps.render.outputs.status == 'done' && matrix.file != ''
        run: |
          git config user.name "viralflow-bot"
          git config user.email "viralflow-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            [ -f "$EP_FILE" ] || exit 0
            mkdir -p episodes/done
            git mv "$EP_FILE" "episodes/done/$(basename "$EP_FILE")"
            git commit -q -m "VIRALFLOW: $(basename "$EP_FILE") gerendert [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git reset -q --hard "origin/${GITHUB_REF_NAME}"; sleep $((i * 5))
          done
          exit 1
