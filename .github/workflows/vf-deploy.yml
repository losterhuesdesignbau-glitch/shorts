# Orchestrator + Dashboard (Cloudflare Worker) automatisch ausrollen, Datenbank-Schema anwenden
name: "VIRALFLOW · Orchestrator deployen"

on:
  push:
    branches: [main]
    paths: ["viralflow/worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viralflow/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viralflow/worker/package-lock.json
      - run: npm ci
      - run: node --test test/*.test.js
      - name: Datenbank-ID einsetzen
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml
      - name: Schema anwenden (idempotent)
        run: npx wrangler d1 execute viralflow --remote --file=schema.sql
      - name: Deploy
        run: npx wrangler deploy
      - name: Secrets aus GitHub an den Worker übergeben
        env:
          S_DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          S_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S_TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          S_VF_WEBHOOK_SECRET: ${{ secrets.VF_WEBHOOK_SECRET }}
          S_GITHUB_TOKEN: ${{ secrets.VF_GITHUB_TOKEN }}
          S_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          S_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          S_INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          S_INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          S_TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          S_TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          S_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - > "$RUNNER_TEMP/secrets.json" <<'EOF'
          import json, os
          print(json.dumps({k[2:]: v for k, v in os.environ.items() if k.startswith("S_") and v}))
          EOF
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
