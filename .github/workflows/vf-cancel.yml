# Geplante Veröffentlichungen abbrechen (z. B. ersetzte Videos)
name: "VIRALFLOW · Veröffentlichungen abbrechen / neu einreihen"
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Veröffentlichungs-IDs, Komma-getrennt (video-id:plattform) – oder liste / plattform:instagram"
        required: true
      requeue:
        description: "ja = sofort neu einreihen statt abbrechen"
        required: false
        default: "nein"
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      VF_API_URL: ${{ secrets.VF_API_URL }}
      VF_WEBHOOK_SECRET: ${{ secrets.VF_WEBHOOK_SECRET }}
      PYTHONPATH: ${{ github.workspace }}/viralflow
      IDS: ${{ inputs.ids }}
      REQUEUE: ${{ inputs.requeue }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: viralflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: |
          case "$IDS" in
            liste) python -m vf.cancel --list ;;
            plattform:*) python -m vf.cancel --platform "${IDS#plattform:}" --requeue ;;
            *) if [ "$REQUEUE" = "ja" ]; then python -m vf.cancel --ids "$IDS" --requeue; else python -m vf.cancel --ids "$IDS"; fi ;;
          esac
      - if: false
        run: if [ "$REQUEUE" = "ja" ]; then python -m vf.cancel --ids "$IDS" --requeue; else python -m vf.cancel --ids "$IDS"; fi
