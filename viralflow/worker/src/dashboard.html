<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>VIRALFLOW CLOUD</title>
<style>
:root{--bg:#0e0f13;--panel:#171920;--panel2:#1e2129;--line:#2a2e38;--text:#e9ebf0;--mute:#8d93a3;--accent:#7c5cff;--accent2:#a48bff;--ok:#2fbf71;--warn:#f0b429;--bad:#ef5350;--yt:#ff3b30;--ig:#d6249f;--tt:#25f4ee;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent2)}button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;letter-spacing:.04em;font-size:18px;padding:4px 10px 18px}.brand span{color:var(--accent2)}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mute);cursor:pointer;text-align:left}
nav button.on,nav button:hover{background:var(--panel2);color:var(--text)}
main{padding:24px clamp(14px,3vw,36px) 90px;max-width:1200px;width:100%}
h1{font-size:22px;margin:0 0 18px}h2{font-size:16px;margin:26px 0 10px;color:var(--mute);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .n{font-size:30px;font-weight:800}.kpi .l{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item .t{font-weight:600}.mute{color:var(--mute);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.b-ok{color:var(--ok);border-color:#2fbf7155}.b-warn{color:var(--warn);border-color:#f0b42955}.b-bad{color:var(--bad);border-color:#ef535055}.b-acc{color:var(--accent2);border-color:#7c5cff55}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-youtube{background:var(--yt)}.p-instagram{background:var(--ig)}.p-tiktok{background:var(--tt)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 5px}
.form{display:grid;gap:4px 18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.engine{display:flex;gap:14px;align-items:center}.engine .st{font-weight:700}
.sh{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.login{max-width:360px;margin:16vh auto;padding:0 16px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
.modal.on{display:flex}.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
video{width:100%;max-height:70vh;border-radius:10px;background:#000}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.lvl-error{color:var(--bad)}.lvl-warn{color:var(--warn)}
.slot{display:flex;gap:8px;align-items:center;margin:6px 0}.slot input{width:130px}
@media (max-width:820px){.app{grid-template-columns:1fr}
 nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:flex;overflow-x:auto;padding:6px calc(6px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:5}
 .brand{display:none}nav button{flex-direction:column;gap:2px;font-size:11px;min-width:62px;padding:6px 4px;text-align:center;justify-content:center;align-items:center}
 nav .lg{display:none}nav .sh{display:block}
 .grid{grid-template-columns:repeat(2,1fr)}.kpi .n{font-size:24px}.card{padding:13px}
 main{padding-bottom:110px}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="brand" style="font-size:26px;padding:0 0 16px">VIRAL<span>FLOW</span> CLOUD</div>
  <div class="card">
    <label>Passwort</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="height:12px"></div>
    <button class="btn pri" id="loginBtn" style="width:100%">Anmelden</button>
    <div id="loginErr" class="mute" style="margin-top:10px;color:var(--bad)"></div>
  </div>
</div>

<div id="app" class="app" hidden>
  <nav id="nav">
    <div class="brand">VIRAL<span>FLOW</span> CLOUD</div>
  </nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  ['uebersicht', '◎', 'Übersicht', 'Start'], ['produktion', '⚙', 'Video-Produktion', 'Produktion'], ['bibliothek', '▦', 'Video-Bibliothek', 'Videos'],
  ['warteschlange', '⇅', 'Upload-Warteschlange', 'Queue'], ['plan', '◷', 'Veröffentlichungsplan', 'Plan'], ['verbindungen', '⛓', 'Plattformverbindungen', 'Konten'],
  ['protokoll', '≣', 'Upload-Protokoll', 'Protokoll'], ['einstellungen', '⚑', 'Einstellungen', 'Setup'],
];
const PNAME = { youtube: 'YouTube Shorts', instagram: 'Instagram Reels', tiktok: 'TikTok' };
const ST = {
  queued: ['geplant', 'b-acc'], dispatched: ['gestartet', 'b-warn'], uploading: ['lädt hoch', 'b-warn'], published: ['veröffentlicht', 'b-ok'],
  failed: ['fehlgeschlagen', 'b-bad'], cancelled: ['abgebrochen', ''], scheduled: ['geplant', 'b-acc'], publishing: ['läuft', 'b-warn'],
  partial: ['teilweise', 'b-warn'], received: ['empfangen', ''], archived: ['archiviert', 'b-ok'], waiting: ['wartet', 'b-warn'],
  rendering: ['rendert', 'b-warn'], done: ['fertig', 'b-ok'],
};
let TZ = 'Europe/Berlin', SETTINGS = {}, current = 'uebersicht', timer = null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => iso ? new Intl.DateTimeFormat('de-DE', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) : '–';
const badge = (s) => { const [t, c] = ST[s] || [s, '']; return `<span class="badge ${c}">${esc(t)}</span>`; };
const pdot = (p) => `<span class="dot p-${p}"></span>`;
const title = (md) => { try { return JSON.parse(md || '{}').title || ''; } catch { return ''; } };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

async function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: { 'x-vf': '1' } };
  if (opts.body !== undefined) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Bitte anmelden'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const act = async (path, body, msg) => { try { await api(path, { method: 'POST', body: body || {} }); toast(msg || 'Erledigt'); render(); } catch (e) { toast(e.message); } };

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pw').focus(); }
$('#loginBtn').onclick = async () => {
  try { await api('/api/login', { method: 'POST', body: { password: $('#pw').value } }); $('#login').hidden = true; boot(); }
  catch (e) { $('#loginErr').textContent = e.message; }
};
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#loginBtn').click(); };
$('#modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
function modal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modalBody').innerHTML = ''; }

function boot() {
  $('#app').hidden = false;
  const nav = $('#nav');
  nav.querySelectorAll('button').forEach((b) => b.remove());
  for (const [id, ic, label, short] of SECTIONS) {
    const b = document.createElement('button');
    b.innerHTML = `<span>${ic}</span><span class="lg">${label}</span><span class="sh">${short}</span>`; b.dataset.id = id;
    b.onclick = () => { location.hash = id; };
    nav.appendChild(b);
  }
  window.onhashchange = () => { current = (location.hash.slice(1) || 'uebersicht'); render(); };
  window.onhashchange();
}

async function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.id === current));
  clearInterval(timer);
  const m = $('#main');
  try {
    SETTINGS = await api('/api/settings'); TZ = SETTINGS.timezone || TZ;
    m.innerHTML = await (VIEWS[current] || VIEWS.uebersicht)();
    (AFTER[current] || (() => {}))();
    if (['uebersicht', 'warteschlange', 'produktion'].includes(current)) timer = setInterval(render, 30000);
  } catch (e) { if (e.message !== 'Bitte anmelden') m.innerHTML = `<div class="card">Fehler: ${esc(e.message)}</div>`; }
}

const engineCard = (n, label, paused, desc) => `
  <div class="card engine"><div class="sp"><div class="mute">${label}</div>
  <div class="st" style="color:${paused ? 'var(--warn)' : 'var(--ok)'}">${paused ? '⏸ pausiert' : '● läuft'}</div><div class="mute">${desc}</div></div>
  <button class="btn ${paused ? 'pri' : ''}" onclick="act('/api/control',{engine:'${n}',action:'${paused ? 'start' : 'pause'}'},'${paused ? 'Gestartet' : 'Pausiert'}')">${paused ? 'Starten' : 'Pausieren'}</button></div>`;

const pubRow = (p, actions = true) => `
  <div class="item">${pdot(p.platform)}<div class="sp"><div class="t">${esc(title(p.metadata) || p.video_id)}</div>
  <div class="mute">${PNAME[p.platform]} · ${fmt(p.scheduled_at)}${p.attempts ? ` · Versuch ${p.attempts}` : ''}${p.error ? ` · ${esc(p.error)}` : ''}</div></div>
  ${badge(p.status)}${p.remote_url ? `<a class="btn sm" href="${esc(p.remote_url)}" target="_blank" rel="noopener">Ansehen</a>` : ''}
  ${actions ? pubActions(p) : ''}</div>`;
const pubActions = (p) => {
  const id = encodeURIComponent(p.id);
  if (p.status === 'published') return '';
  let b = '';
  if (['queued', 'failed'].includes(p.status)) b += `<button class="btn sm" onclick="act('/api/publications/${id}/now',{},'Wird jetzt veröffentlicht')">Jetzt</button>`;
  if (p.status === 'failed') b += `<button class="btn sm" onclick="act('/api/publications/${id}/retry',{},'Neuer Versuch geplant')">Erneut</button>
     <button class="btn sm" onclick="if(confirm('Wirklich als veröffentlicht markieren? (z. B. wenn du es auf der Plattform gesehen hast)'))act('/api/publications/${id}/mark-published')">Ist online</button>`;
  if (['queued', 'failed'].includes(p.status)) b += `<button class="btn sm danger" onclick="if(confirm('Diese Veröffentlichung abbrechen?'))act('/api/publications/${id}/cancel',{},'Abgebrochen')">✕</button>`;
  return b;
};

const VIEWS = {
  async uebersicht() {
    const o = await api('/api/overview');
    const failed = o.publications_by_status.failed || 0;
    const conn = new Set(o.connections.map((c) => c.platform));
    return `<h1>Übersicht</h1>
    <div class="grid">
      <div class="card kpi"><div class="n">${o.produced}</div><div class="l">Videos produziert</div></div>
      <div class="card kpi"><div class="n">${o.waiting}</div><div class="l">warten auf Veröffentlichung</div></div>
      <div class="card kpi"><div class="n">${o.published_today}</div><div class="l">Veröffentlichungen heute</div></div>
      <div class="card kpi"><div class="n" style="color:${failed ? 'var(--bad)' : 'inherit'}">${failed}</div><div class="l">fehlgeschlagen</div></div>
      <div class="card kpi"><div class="n">${(o.episodes.waiting || 0) + (o.episodes.rendering || 0)}</div><div class="l">in Produktion</div></div>
    </div>
    <h2>Engines</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${engineCard('engine1', 'Engine 1 · Video-Generator', o.settings.engine1_paused, 'Rendert neue Skripte')}
      ${engineCard('engine2', 'Engine 2 · Publisher', o.settings.engine2_paused, 'Veröffentlicht nach Plan')}
    </div>
    <h2>Plattformen</h2><div class="row">${Object.keys(PNAME).map((p) => `<span class="badge ${conn.has(p) ? (o.settings.platforms_enabled[p] ? 'b-ok' : 'b-warn') : 'b-bad'}">${pdot(p)} ${PNAME[p]} · ${conn.has(p) ? (o.settings.platforms_enabled[p] ? 'verbunden' : 'deaktiviert') : 'nicht verbunden'}</span>`).join('')}</div>
    <h2>Als Nächstes</h2><div class="list">${o.next.map((p) => pubRow(p, false)).join('') || '<div class="mute">Nichts geplant.</div>'}</div>
    ${o.failed.length ? `<h2>Fehlgeschlagen</h2><div class="list">${o.failed.map((p) => pubRow(p)).join('')}</div>` : ''}
    <h2>Zuletzt veröffentlicht</h2><div class="list">${o.recent_published.map((p) => pubRow(p, false)).join('') || '<div class="mute">Noch nichts.</div>'}</div>`;
  },

  async produktion() {
    const { episodes } = await api('/api/episodes');
    return `<h1>Video-Produktion</h1>
    ${engineCard('engine1', 'Engine 1 · Video-Generator (Block-Studio)', SETTINGS.engine1_paused, 'Rendert in GitHub Actions – dein PC muss nicht laufen')}
    <h2>Neuen Auftrag einreichen</h2>
    <div class="card"><div class="mute">Am einfachsten: Skript an Claude schicken – Claude erstellt die episode.json und legt sie in <code>episodes/queue/</code>. Alternativ hier einfügen:</div>
      <label>Titel</label><input id="epTitle" placeholder="z. B. The 13th Floor 🛗">
      <label>episode.json (optional mit "meta": {title, description, hashtags})</label><textarea id="epJson" placeholder='{"music":"mystery","shots":[...]}'></textarea>
      <div style="height:10px"></div><button class="btn pri" id="epSend">An Engine 1 übergeben</button></div>
    <h2>Aufträge</h2><div class="list">${episodes.map((e) => `<div class="item"><div class="sp"><div class="t">${esc(e.title || e.id)}</div>
      <div class="mute">${esc(e.id)} · ${e.source === 'git' ? 'Repo' : 'Dashboard'} · ${fmt(e.created_at)}${e.error ? ' · ' + esc(e.error) : ''}</div></div>${badge(e.status)}
      ${e.status === 'failed' ? `<button class="btn sm" onclick="act('/api/episodes/${encodeURIComponent(e.id)}/retry',{},'Neu gestartet')">Erneut</button>` : ''}</div>`).join('') || '<div class="mute">Noch keine Aufträge.</div>'}</div>`;
  },

  async bibliothek() {
    const { videos } = await api('/api/videos');
    window._videos = Object.fromEntries(videos.map((v) => [v.id, v]));
    return `<h1>Video-Bibliothek</h1><div class="list">${videos.map((v) => `<div class="item"><div class="sp" style="min-width:220px">
      <div class="t">${esc(title(v.metadata) || v.filename)}</div>
      <div class="mute">${v.duration ? v.duration.toFixed(1) + ' s · ' : ''}${v.size_bytes ? (v.size_bytes / 1e6).toFixed(1) + ' MB · ' : ''}produziert ${fmt(v.produced_at)} · Termin ${fmt(v.slot_at)}</div>
      <div class="row" style="margin-top:6px">${v.publications.map((p) => `<span class="badge">${pdot(p.platform)} ${(ST[p.status] || [p.status])[0]}${p.privacy && p.status === 'published' ? ' · ' + esc(p.privacy) : ''}</span>`).join('')}</div></div>
      ${badge(v.status)}
      ${v.storage_state === 'stored' ? `<button class="btn sm" onclick="preview('${encodeURIComponent(v.id)}')">▶</button>` : '<span class="mute">Datei gelöscht</span>'}
      <button class="btn sm" onclick="editMeta('${esc(v.id)}')">Texte</button>
      ${['scheduled', 'failed', 'partial'].includes(v.status) ? `<button class="btn sm" onclick="act('/api/videos/${encodeURIComponent(v.id)}/reschedule',{},'Neu eingeplant')">Neu planen</button>` : ''}
      </div>`).join('') || '<div class="mute">Noch keine Videos.</div>'}</div>`;
  },

  async warteschlange() {
    const { items } = await api('/api/queue');
    return `<h1>Upload-Warteschlange</h1>
    <div class="row" style="margin-bottom:12px">${badge(SETTINGS.engine2_paused ? 'waiting' : 'publishing')}<span class="mute">Engine 2 ${SETTINGS.engine2_paused ? 'pausiert' : 'aktiv'} · Prüfung alle 5 Minuten</span><span class="sp"></span>
    <button class="btn sm" onclick="act('/api/tick',{},'Warteschlange geprüft')">Jetzt prüfen</button></div>
    <div class="list">${items.map((p) => pubRow(p)).join('') || '<div class="mute">Warteschlange leer.</div>'}</div>`;
  },

  async plan() {
    const p = await api('/api/plan');
    const byIso = {};
    for (const s of p.scheduled) byIso[s.slot_at] = s;
    return `<h1>Veröffentlichungsplan</h1>
    <div class="card"><div class="mute">Jedes Video wird zum Termin auf allen verbundenen Plattformen veröffentlicht. Ist ein Video nicht rechtzeitig fertig, bekommt es automatisch den nächsten freien Termin.</div>
      <label>Uhrzeiten (${esc(p.timezone)})</label><div id="slots">${p.slots.map((s) => slotInput(s)).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" onclick="addSlot()">+ Uhrzeit</button><span class="sp"></span>
      <label style="margin:0">Zeitzone</label><input id="tz" value="${esc(p.timezone)}" style="width:200px">
      <button class="btn pri" onclick="saveSlots()">Speichern</button></div></div>
    <h2>Kommende Termine</h2><div class="list">${p.upcoming.map((u) => { const s = byIso[u.iso]; return `<div class="item"><div style="width:150px" class="t">${fmt(u.iso)}</div>
      <div class="sp">${s ? esc(title(s.metadata) || s.id) : '<span class="mute">frei</span>'}</div>${s ? (s.pubs || '').split(',').map((x) => { const [pl, st] = x.split(':'); return `<span class="badge">${pdot(pl)} ${(ST[st] || [st])[0]}</span>`; }).join('') : ''}</div>`; }).join('')}</div>`;
  },

  async verbindungen() {
    const c = await api('/api/connections');
    return `<h1>Plattformverbindungen</h1><div class="list">${c.connections.map((x) => `<div class="card">
      <div class="row">${pdot(x.platform)}<b>${PNAME[x.platform]}</b><span class="sp"></span>
      <label class="row" style="margin:0;color:var(--text)"><input type="checkbox" style="width:auto" ${x.enabled ? 'checked' : ''} onchange="togglePlatform('${x.platform}',this.checked)"> aktiv</label></div>
      <div class="mute" style="margin:8px 0">${x.connection ? `Verbunden mit <b>${esc(x.connection.account_name)}</b> seit ${fmt(x.connection.connected_at)}` : (x.app_configured ? 'Nicht verbunden' : 'App-Zugangsdaten fehlen noch (siehe Anleitung)')}</div>
      <div class="row"><a class="btn ${x.connection ? '' : 'pri'}" href="/oauth/${x.platform}/start">${x.connection ? 'Neu verbinden' : 'Verbinden'}</a>
      ${x.connection ? `<button class="btn danger" onclick="if(confirm('Verbindung trennen?'))api('/api/connections/${x.platform}',{method:'DELETE'}).then(render)">Trennen</button>` : ''}</div>
      <div class="mute" style="margin-top:8px">Redirect-URI für die App: <code>${esc(c.redirect_base)}/oauth/${x.platform}/callback</code></div></div>`).join('')}</div>`;
  },

  async protokoll() {
    const { events } = await api('/api/events' + (window._lvl ? '?level=' + window._lvl : ''));
    return `<h1>Upload-Protokoll</h1><div class="row" style="margin-bottom:10px">
      ${['', 'error', 'warn'].map((l) => `<button class="btn sm ${(window._lvl || '') === l ? 'pri' : ''}" onclick="window._lvl='${l}';render()">${l ? (l === 'error' ? 'Fehler' : 'Warnungen') : 'Alle'}</button>`).join('')}</div>
      <div class="card" style="overflow:auto"><table><tr><th>Zeit</th><th>Ereignis</th><th>Video</th><th>Nachricht</th></tr>
      ${events.map((e) => `<tr class="lvl-${e.level}"><td class="mute" style="white-space:nowrap">${fmt(e.at)}</td><td><b>${esc(e.type)}</b>${e.platform ? '<br>' + pdot(e.platform) + ' ' + e.platform : ''}</td><td class="mute">${esc(e.video_id || '')}</td><td>${esc(e.message || '')}</td></tr>`).join('')}</table></div>`;
  },

  async einstellungen() {
    const s = SETTINGS;
    const opt = (k, list) => `<select id="s_${k}">${list.map(([v, t]) => `<option value="${v}" ${String(s[k]) === String(v) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
    return `<h1>Einstellungen</h1>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${engineCard('engine1', 'Engine 1', s.engine1_paused, 'Video-Generator')}${engineCard('engine2', 'Engine 2', s.engine2_paused, 'Publisher')}</div>
    <h2>Veröffentlichung</h2><div class="card form">
      <div><label>YouTube-Sichtbarkeit</label>${opt('youtube_privacy', [['public', 'Öffentlich'], ['unlisted', 'Nicht gelistet'], ['private', 'Privat']])}</div>
      <div><label>YouTube-Kategorie</label>${opt('youtube_category', [['24', 'Unterhaltung'], ['20', 'Gaming'], ['27', 'Bildung'], ['22', 'Menschen & Blogs'], ['1', 'Film & Animation']])}</div>
      <div><label>TikTok-Modus</label>${opt('tiktok_mode', [['auto', 'Automatisch (Direct Post, sonst Entwurf)'], ['direct', 'Nur Direct Post'], ['draft', 'Immer als Entwurf']])}</div>
      <div><label>TikTok-Sichtbarkeit (Direct Post)</label>${opt('tiktok_privacy', [['PUBLIC_TO_EVERYONE', 'Öffentlich'], ['FOLLOWER_OF_CREATOR', 'Follower'], ['MUTUAL_FOLLOW_FRIENDS', 'Freunde'], ['SELF_ONLY', 'Nur ich']])}</div>
      <div><label>Sprache der Texte</label>${opt('language', [['', 'Automatisch'], ['en', 'Englisch'], ['de', 'Deutsch']])}</div>
      <div><label>Feste Hashtags (zusätzlich)</label><input id="s_base_hashtags" value="${esc(s.base_hashtags)}" placeholder="#gaming #story"></div>
      <div><label>Max. Versuche pro Upload</label><input id="s_max_attempts" type="number" min="1" max="10" value="${s.max_attempts}"></div>
    </div>
    <h2>Speicher</h2><div class="card form">
      <div><label>Nach Veröffentlichung</label>${opt('retention', [['delete', 'Video aus R2 löschen'], ['keep', 'Behalten']])}</div>
      <div><label>Löschen nach (Tagen)</label><input id="s_retention_days" type="number" min="0" value="${s.retention_days}"></div>
    </div>
    <h2>Benachrichtigungen (ntfy)</h2><div class="card form">
      <div><label>Bei Erfolg</label>${opt('notify_success', [['true', 'Ja'], ['false', 'Nein']])}</div>
      <div><label>Bei Fehlern</label>${opt('notify_failure', [['true', 'Ja'], ['false', 'Nein']])}</div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn pri" onclick="saveSettings()">Speichern</button><span class="sp"></span>
      <button class="btn" onclick="act('/api/test-dispatch',{},'GitHub-Verbindung OK')">GitHub-Verbindung testen</button>
      <button class="btn" onclick="api('/api/logout',{method:'POST'}).then(showLogin)">Abmelden</button></div>`;
  },
};
const AFTER = {
  produktion() {
    $('#epSend').onclick = async () => {
      try { const r = await api('/api/episodes', { method: 'POST', body: { title: $('#epTitle').value, episode: $('#epJson').value } }); toast('Übergeben: ' + r.id); render(); }
      catch (e) { toast(e.message); }
    };
  },
};
const slotInput = (s) => `<div class="slot"><input type="time" value="${esc(s)}"><button class="btn sm danger" onclick="this.parentNode.remove()">✕</button></div>`;
function addSlot() { $('#slots').insertAdjacentHTML('beforeend', slotInput('12:00')); }
async function saveSlots() {
  const slots = [...document.querySelectorAll('#slots input')].map((i) => i.value).filter(Boolean);
  try { await api('/api/settings', { method: 'PUT', body: { slots, timezone: $('#tz').value } }); toast('Plan gespeichert'); render(); } catch (e) { toast(e.message); }
}
async function togglePlatform(p, on) {
  try { await api('/api/settings', { method: 'PUT', body: { platforms_enabled: { ...SETTINGS.platforms_enabled, [p]: on } } }); toast(on ? 'Aktiviert' : 'Deaktiviert'); } catch (e) { toast(e.message); }
}
async function saveSettings() {
  const b = {};
  for (const k of ['youtube_privacy', 'youtube_category', 'tiktok_mode', 'tiktok_privacy', 'language', 'base_hashtags', 'max_attempts', 'retention', 'retention_days']) b[k] = $('#s_' + k).value;
  for (const k of ['notify_success', 'notify_failure']) b[k] = $('#s_' + k).value === 'true';
  try { await api('/api/settings', { method: 'PUT', body: b }); toast('Gespeichert'); render(); } catch (e) { toast(e.message); }
}
function preview(id) { modal(`<video controls autoplay playsinline src="/api/videos/${id}/file"></video><div style="height:10px"></div><button class="btn" onclick="closeModal()">Schließen</button>`); }
function editMeta(id) {
  const v = window._videos[id]; const m = JSON.parse(v.metadata || '{}');
  modal(`<h1 style="font-size:18px">Texte bearbeiten</h1>
    <label>YouTube-Titel</label><input id="m_yt_t" value="${esc(m.youtube?.title)}">
    <label>YouTube-Beschreibung</label><textarea id="m_yt_d" style="min-height:90px">${esc(m.youtube?.description)}</textarea>
    <label>Instagram-Caption</label><textarea id="m_ig" style="min-height:90px">${esc(m.instagram?.caption)}</textarea>
    <label>TikTok-Text</label><textarea id="m_tt" style="min-height:70px">${esc(m.tiktok?.title)}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="m_save">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`);
  $('#m_save').onclick = async () => {
    const body = { youtube: { ...m.youtube, title: $('#m_yt_t').value, description: $('#m_yt_d').value }, instagram: { caption: $('#m_ig').value }, tiktok: { title: $('#m_tt').value } };
    try { await api(`/api/videos/${encodeURIComponent(id)}/metadata`, { method: 'PUT', body }); closeModal(); toast('Gespeichert'); render(); } catch (e) { toast(e.message); }
  };
}
api('/api/settings').then(() => boot()).catch(() => showLogin());
</script>
</body>
</html>
